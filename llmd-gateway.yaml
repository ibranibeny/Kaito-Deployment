apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: llmd-inference-gateway
  namespace: default
spec:
  gatewayClassName: llm-d
  listeners:
  - name: http
    port: 8080
    protocol: HTTP
    allowedRoutes:
      namespaces:
        from: Same
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: llmd-model-route
  namespace: default
spec:
  parentRefs:
  - name: llmd-inference-gateway
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /v1
    backendRefs:
    - group: inference.networking.x-k8s.io
      kind: InferencePool
      name: kaito-gpt-oss-20b-pool
      port: 80
